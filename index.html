background:#2b3950;color:white;padding:6px 9px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:9}.sidebtn:hover .tip{display:block}.side-spacer{flex:1;min-height:10px}.main{margin-left:78px;padding:83px 22px 30px;max-width:1900px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 22px}.pagehead h1{font-size:24px;margin:0 0 7px;letter-spacing:-.5px}.pagehead p{margin:0;color:#b5c1d2;font-size:12px}.pagehead p b{color:#78adff}.datearea{display:flex;align-items:center;gap:12px;color:#aab6c8;font-size:10px}.datepill{background:#fff;color:#8591a3;border-radius:8px;padding:10px 13px}.btn{border:0;border-radius:8px;background:#5548e8;color:#fff;padding:9px 13px;font-size:11px;font-weight:750}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#2d3b53;color:#e8eef8}.btn.green{background:#087c60}.btn.red{background:#8d2935}.btn.orange{background:#805315}.btn.small{padding:6px 9px;font-size:10px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:23px}.stat{background:var(--panel);border:1px solid #29374d;border-radius:12px;min-height:160px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;gap:7px;color:#aab6c7;font-size:11px}.stat-icon{width:48px;height:50px;border-radius:10px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.stat-number{font-size:26px;font-weight:850;letter-spacing:-.6px;margin:8px 0}.stat-foot{color:#aab5c5;font-size:10px}.up{color:#2cdb9b;font-weight:750}.down{color:#ff6875;font-weight:750}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.gridwide{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.card,.module{background:var(--panel);border:1px solid #29374d;border-radius:12px;padding:19px;box-shadow:var(--shadow);min-width:0}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.card h3{font-size:13px;margin:0}.muted{color:var(--muted)}.tiny{font-size:10px}.chart{height:245px;width:100%;display:block}.chart text{fill:#94a3b8;font-size:10px}.chart .gridline{stroke:#bdc9d9;stroke-opacity:.55}.chart .line{fill:none;stroke:#6b5cff;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chart .bar{rx:2}.listrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #344055}.listrow:last-child{border:0}.listicon{width:34px;height:34px;border-radius:9px;background:#30405a;display:grid;place-items:center}.listrow strong{font-size:11px}.listrow p{margin:4px 0 0;color:#9aa8bb;font-size:10px}.listrow .right{margin-left:auto;text-align:right;color:#b8c5d7;font-size:10px}.notice{background:#302814;border:1px solid #70551e;color:#e8ce8b;padding:11px 13px;border-radius:8px;font-size:10px;line-height:1.5;margin:12px 0}.module{padding:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{background:#111b2b;color:#e9f0fa;border:1px solid #394860;border-radius:8px;padding:9px 11px;font-size:11px}.toolbar input{min-width:190px}.toolbar .push{margin-left:auto}.tablewrap{overflow:auto}.datatable{width:100%;border-collapse:collapse;min-width:650px}.datatable th{text-align:left;color:#9eacc0;font-size:9px;text-transform:uppercase;letter-spacing:.7px;padding:12px 9px;border-bottom:1px solid #394860}.datatable td{padding:11px 9px;border-bottom:1px solid #303e53;font-size:10px;vertical-align:middle}.datatable tr:last-child td{border-bottom:0}.datatable tr:hover td{background:#ffffff06}.status{display:inline-block;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:750;background:#134f40;color:#5de0ae;white-space:nowrap}.status.pending{background:#59431e;color:#ffd27a}.status.cancelled{background:#5b2630;color:#ff9aa2}.status.neutral{background:#30415b;color:#c4d3e8}.empty{text-align:center;padding:35px;color:#a6b2c4;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:#b6c2d2;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #3b4a60;border-radius:7px;background:#0e1726;color:#f0f4fa;font-size:11px;outline:0}.field textarea{min-height:70px;resize:vertical}.field.full{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{width:min(740px,100%);max-height:90vh;overflow:auto;background:#172234;border:1px solid #3a4a62;border-radius:14px;padding:20px;box-shadow:0 20px 70px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:17px}.xbtn{background:#2c3a50;color:#fff;border:0;border-radius:7px;padding:7px 10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:18px;bottom:18px;background:#123e36;border:1px solid #1c886c;color:#c9ffec;padding:11px 15px;border-radius:9px;z-index:30;display:none;font-size:11px}.toast.show{display:block}.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid #34435a;border-radius:9px;background:#172337;color:#edf3ff;text-align:left;padding:13px}.quick span{font-size:20px}.quick b{display:block;font-size:10px;margin-top:7px}.quick small{color:#9aa8bb;font-size:9px}.profilebox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.profilebox .card{box-shadow:none}.mobilemenu{display:none}
@media(max-width:1120px){.stats{grid-template-columns:repeat(3,1fr)}.toplinks button{padding:9px 7px}.stat{min-height:140px;padding:15px}}

@media(max-width:480px){.stats{gap:7px}.stat{padding:11px;min-height:125px}.stat-number{font-size:21px}.stat-icon{width:38px;height:39px;font-size:18px}.pagehead h1{font-size:19px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.main{padding-left:9px;padding-right:9px}.toolbar input{min-width:130px}}

body.presentation-mode .topbar,
body.presentation-mode .sidebar,
body.presentation-mode .pagehead .datearea,
body.presentation-mode .pagehead .btn,
body.presentation-mode .quickgrid,
body.presentation-mode .notice {display:none!important}
body.presentation-mode .main{margin:0 auto;padding:28px 4vw;max-width:1600px}
body.presentation-mode .pagehead{margin:0 0 24px}
body.presentation-mode .pagehead h1{font-size:34px}
body.presentation-mode .grid2{grid-template-columns:1fr 1fr;gap:24px}
body.presentation-mode .card{padding:26px}
body.presentation-mode .chart{height:360px}
body.presentation-mode .card h3{font-size:17px}
body.presentation-mode .muted.tiny{font-size:12px}
.presentation-controls{display:flex;gap:8px;align-items:center}
.presentation-controls .btn{white-space:nowrap}
@media(max-width:800px){
 body.presentation-mode .grid2{grid-template-columns:1fr}
 body.presentation-mode .chart{height:280px}
 body.presentation-mode .pagehead h1{font-size:26px}
}

@media print{.topbar,.sidebar,.btn,.toolbar,.notice{display:none!important}.main{margin:0;padding:10px}.card,.module,.stat{break-inside:avoid;background:white;color:#111;border:1px solid #ddd;box-shadow:none}.datatable td,.datatable th{color:#111}}
</style>
</head>
<body>
<header class="topbar"><button class="topicon mobilemenu" onclick="toggleSide()">☰</button><div class="brand"><i>✦</i>AstroCare</div><nav class="toplinks" id="toplinks"></nav><div class="search"><input id="globalSearch" placeholder="Search patients, reports..." oninput="render()"><span>⌕</span></div><button class="topicon" onclick="notify('No new notifications')">♟</button><button class="topicon" onclick="toggleTheme()">☾</button><div class="profile"><div class="avatar">✚</div><b>Signed out</b><button class="btn secondary small" onclick="logout()">Sign out</button></div></header>
<aside class="sidebar" id="sidebar"><button class="sidebtn" onclick="toggleSide()">»<span class="tip">Menu</span></button><div id="sidebuttons"></div><div class="side-spacer"></div><button class="sidebtn" onclick="go('reports')">▥<span class="tip">Reports</span></button><button class="sidebtn" onclick="go('settings')">⚙<span class="tip">Settings</span></button></aside>
<main class="main" id="main"></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="xbtn" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="formgrid" id="fields"></div><div class="modalactions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save record</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const sections=[
['dashboard','Dashboard','⌂'],['doctor-dashboard','Doctor Dashboard','⚕'],['nurse-dashboard','Nurse Dashboard','♡'],['reception-dashboard','Reception Dashboard','▣'],['patient-dashboard','Patient Portal','♙'],['pharmacy-dashboard','Pharmacy Dashboard','♧'],['superadmin-dashboard','Super Admin','⚙'],['patients','Patients','♟'],['appointments','Appointments','▦'],['doctors','Doctors','⚕'],['nurses','Nurses','♡'],['staff','Staff','♙'],['departments','Departments','▤'],['admissions','Admissions','▣'],['rooms','Rooms & Beds','▱'],['laboratory','Lab','⚗'],['pharmacy','Pharmacy','♧'],['supplies','Medical Supplies','▧'],['prescriptions','Prescriptions','℞'],['billing','Billing','＄'],['insurance','Insurance','▤'],['reports','Reports','▥'],['users','Admin Users','⚙'],['settings','Settings','⚙']
];
const schema={
patients:[['patientId','Patient ID','text'],['name','Full name','text'],['age','Age','number'],['gender','Gender','select','Female,Male,Other'],['phone','Phone','tel'],['email','Email','email'],['department','Department','text'],['doctor','Assigned doctor','text'],['bloodGroup','Blood group','select','A+,A-,B+,B-,AB+,AB-,O+,O-'],['status','Status','select','Active,Admitted,Discharged'],['notes','Notes','textarea']],
appointments:[['appointmentId','Appointment ID','text'],['patient','Patient name','text'],['doctor','Doctor','text'],['department','Department','text'],['date','Date','date'],['time','Time','time'],['type','Appointment type','select','General,Cardiology,Pediatrics,Orthopedics,Dermatology'],['status','Status','select','Confirmed,Pending,Cancelled,Completed']],
doctors:[['doctorId','Doctor ID','text'],['name','Doctor name','text'],['specialty','Specialty','text'],['department','Department','text'],['phone','Phone','tel'],['email','Email','email'],['availability','Availability','select','Available,Busy,On leave']],
nurses:[['nurseId','Nurse ID','text'],['name','Nurse name','text'],['department','Department','text'],['shift','Shift','select','Morning,Afternoon,Night'],['phone','Phone','tel'],['status','Status','select','Active,On leave']],
staff:[['staffId','Staff ID','text'],['name','Full name','text'],['role','Role','text'],['department','Department','text'],['shift','Shift','select','Morning,Afternoon,Night'],['phone','Phone','tel'],['status','Status','select','Active,On leave,Inactive']],
departments:[['departmentId','Department ID','text'],['name','Department name','text'],['head','Department head','text'],['location','Location','text'],['phone','Phone','tel'],['description','Description','textarea']],
admissions:[['admissionId','Admission ID','text'],['patient','Patient name','text'],['room','Room / Bed','text'],['admissionDate','Admission date','date'],['dischargeDate','Discharge date','date'],['doctor','Doctor','text'],['status','Status','select','Admitted,Discharged']],
rooms:[['roomNo','Room number','text'],['type','Room type','select','General,Private,ICU,Maternity,Emergency'],['beds','Total beds','number'],['occupied','Occupied beds','number'],['status','Status','select','Available,Occupied,Maintenance']],
laboratory:[['testId','Test ID','text'],['patient','Patient name','text'],['test','Test name','text'],['requestedBy','Requested by','text'],['date','Request date','date'],['result','Result / Notes','textarea'],['status','Status','select','Requested,Processing,Completed']],
pharmacy:[['medicineId','Medicine ID','text'],['name','Medicine name','text'],['category','Category','text'],['quantity','Quantity','number'],['expiry','Expiry date','date'],['supplier','Supplier','text'],['reorderLevel','Reorder level','number'],['status','Stock status','select','In stock,Low stock,Out of stock']],
supplies:[['itemId','Item ID','text'],['name','Supply name','text'],['category','Category','text'],['quantity','Quantity','number'],['unit','Unit','text'],['supplier','Supplier','text'],['status','Status','select','In stock,Low stock,Out of stock']],
prescriptions:[['prescriptionId','Prescription ID','text'],['patient','Patient name','text'],['doctor','Prescribing doctor','text'],['medicine','Medicine','text'],['dosage','Dosage instructions','text'],['date','Date','date'],['status','Status','select','Issued,Dispensed,Cancelled']],
billing:[['invoiceId','Invoice ID','text'],['patient','Patient name','text'],['description','Description','text'],['amount','Amount','number'],['date','Date','date'],['method','Payment method','select','Cash,Card,Bank transfer,Insurance'],['status','Status','select','Paid,Pending,Partially paid']],
insurance:[['policyId','Policy ID','text'],['patient','Patient name','text'],['provider','Insurance provider','text'],['memberNo','Member number','text'],['coverage','Coverage details','text'],['expiry','Expiry date','date'],['status','Status','select','Active,Expired,Pending']],
users:[['username','Username','text'],['name','Full name','text'],['role','Role','select','Administrator,Doctor,Nurse,Receptionist,Accountant,Pharmacist,Laboratory'],['email','Email','email'],['status','Status','select','Active,Disabled']]
};
const singular={patients:'Patient',appointments:'Appointment',doctors:'Doctor',nurses:'Nurse',staff:'Staff member',departments:'Department',admissions:'Admission',rooms:'Room',laboratory:'Lab test',pharmacy:'Medicine',supplies:'Supply item',prescriptions:'Prescription',billing:'Invoice',insurance:'Insurance policy',users:'User'};
const db={};Object.keys(schema).forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem('astrocare_pro_'+k)||'[]')}catch{db[k]=[]}});
let page='login',editIndex=null,sideOpen=false;
let activeAccount=null;
const accountDirectory={
 'doctor-dashboard':{role:'doctor',label:'Doctor Dashboard',username:'doctor',password:'Doctor@123',tasks:['Review daily appointment schedule','Review assigned patient records and document consultations','Review laboratory requests and results','Create and update prescriptions','Coordinate admissions and referrals']},
 'nurse-dashboard':{role:'nurse',label:'Nurse Dashboard',username:'nurse',password:'Nurse@123',tasks:['Review ward admissions and patient assignments','Monitor room and bed availability','Record and communicate care observations','Track pending laboratory requests','Coordinate patient transfers and discharge preparation']},
 'reception-dashboard':{role:'receptionist',label:'Receptionist Dashboard',username:'reception',password:'Reception@123',tasks:['Register patients and verify demographic details','Schedule, confirm and update appointments','Coordinate admission and discharge paperwork','Maintain doctor directory and availability details','Direct billing and insurance enquiries to the appropriate team']},
 'patient-dashboard':{role:'patient',label:'Patient Portal',username:'patient',password:'Patient@123',tasks:['Review your appointment information','Review prescriptions and clinician instructions','Review billing and insurance information','Contact the care team for corrections or questions','Do not use the portal for emergencies']},
 'pharmacy-dashboard':{role:'pharmacy',label:'Pharmacy Dashboard',username:'pharmacy',password:'Pharmacy@123',tasks:['Review and dispense authorized prescriptions','Monitor medicine quantities and expiry dates','Flag low-stock and out-of-stock items','Maintain medical supply inventory','Coordinate medicine queries with prescribers']},
 'superadmin-dashboard':{role:'superadmin',label:'Super Admin Dashboard',username:'admin',password:'Admin@123',tasks:['Manage staff accounts and role assignments','Review system-wide operational reports','Manage departments and system configuration','Oversee data backup and restore procedures','Review access logs and security incidents']}};
const rolePermissions={doctor:['doctor-dashboard','patients','appointments','doctors','departments','admissions','laboratory','prescriptions'],nurse:['nurse-dashboard','patients','appointments','nurses','departments','admissions','rooms','laboratory','prescriptions'],receptionist:['reception-dashboard','patients','appointments','doctors','departments','admissions','billing','insurance'],patient:['patient-dashboard'],pharmacy:['pharmacy-dashboard','pharmacy','prescriptions','supplies','laboratory'],superadmin:['superadmin-dashboard','dashboard','patients','appointments','doctors','nurses','staff','departments','admissions','rooms','laboratory','pharmacy','supplies','prescriptions','billing','insurance','reports','users','settings']};
function save(){Object.keys(db).forEach(k=>localStorage.setItem('astrocare_pro_'+k,JSON.stringify(db[k])))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function go(id){document.body.classList.remove('presentation-mode');if(!activeAccount){page='login';render();return}const allowed=rolePermissions[activeAccount.role]||[];if(!allowed.includes(id)){notify('Your account does not have access to that module');return}page=id;render();document.getElementById('sidebar').classList.remove('open')}
function buildNav(){const allowed=activeAccount?(rolePermissions[activeAccount.role]||[]):[];let visible=sections.filter(s=>allowed.includes(s[0]));let top=['patients','appointments','laboratory','pharmacy','users'];document.getElementById('toplinks').innerHTML=visible.filter(s=>top.includes(s[0])).map(s=>`<button class="${page===s[0]?'active':''}" onclick="go('${s[0]}')">${s[2]} ${s[1]}</button>`).join('');document.getElementById('sidebuttons').innerHTML=visible.map(s=>`<button class="sidebtn ${page===s[0]?'active':''}" onclick="go('${s[0]}')">${s[2]}<span class="tip">${s[1]}</span></button>`).join('');document.querySelector('.profile b').textContent=activeAccount?activeAccount.username:'Signed out';}
function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function togglePresentation(){
 const active=document.body.classList.toggle('presentation-mode');
 const button=document.querySelector('.presentation-controls .btn');
 if(button)button.textContent=active?'✕ Exit presentation':'▶ Present charts';
 if(active)window.scrollTo({top:0,behavior:'smooth'});
}
function toggleTheme(){let light=document.body.classList.toggle('light');document.documentElement.style.setProperty('--bg',light?'#e9eef7':'#080c16');document.documentElement.style.setProperty('--panel',light?'#fff':'#202b3d');document.documentElement.style.setProperty('--text',light?'#182538':'#edf3ff');notify(light?'Light theme enabled':'Dark theme enabled')}
function stat(label,value,icon,color,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" style="background:${color}22;color:${color}">${icon}</span></div><div><div class="stat-number" style="color:${color}">${value}</div><div class="stat-foot">${foot||''}</div></div></div>`}
function admissionsChart(){let v=Array.from({length:30},(_,i)=>db.admissions.length?Math.max(8,Math.round((db.admissions.length*2+Math.sin(i*1.4)*15+i%6*3))):[21,28,68,60,37,65,48,25,64,67,61,48,37,20,63,40,37,19,55,62,48,29,58,20,50,41,43,22,55,50][i]);let w=550,h=240,l=30,b=210,pts=v.map((n,i)=>`${l+i*(w-l-10)/29},${b-n*2.55}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${Array.from({length:6},(_,i)=>`<line class="gridline" x1="${l}" y1="${12+i*39}" x2="540" y2="${12+i*39}"/><text x="3" y="${16+i*39}">${70-i*10}</text>`).join('')}<polyline class="line" points="${pts}"/></svg>`}
function typeChart(){let labels=['General','Cardiology','Pediatrics','Orthopedics','Dermatology'],vals=[65,59,80,81,56],colors=['#5545e9','#13b889','#3985f5','#f59e0b','#f0444b'];if(db.appointments.length){let c={};db.appointments.forEach(a=>c[a.type||'General']=(c[a.type||'General']||0)+1);labels=Object.keys(c).slice(0,5);vals=labels.map(x=>c[x]);let max=Math.max(...vals,1);vals=vals.map(x=>Math.round(x/max*80))}return `<svg class="chart" viewBox="0 0 550 240" preserveAspectRatio="none">${Array.from({length:10},(_,i)=>`<line class="gridline" x1="30" y1="${210-i*21}" x2="540" y2="${210-i*21}"/><text x="2" y="${214-i*21}">${i*10}</text>`).join('')}${labels.map((n,i)=>{let x=48+i*99,v=vals[i]||0;return `<rect class="bar" x="${x}" y="${210-v*2.1}" width="68" height="${v*2.1}" fill="${colors[i%5]}"/><text x="${x+34}" y="232" text-anchor="middle">${esc(n)}</text>`}).join('')}</svg>`}
function recent(){let a=db.patients.slice(-5).reverse();return a.length?a.map(p=>`<div class="listrow"><div class="listicon">♟</div><div><strong>${esc(p.name)}</strong><p>${esc(p.patientId||'Patient')} · ${esc(p.department||'General')}</p></div><div class="right">${esc(p.status||'Active')}</div></div>`).join(''):`<div class="empty">No patients added yet. Register a demo patient to see recent activity.</div>`}
function upcoming(){let a=db.appointments.slice(-5).reverse();return a.length?a.map(p=>`<div class="listrow"><div class="listicon">▦</div><div><strong>${esc(p.patient)}</strong><p>${esc(p.doctor||'Doctor')} · ${esc(p.type||'General')}</p></div><div class="right">${esc(p.date||'—')}<br>${esc(p.time||'')}</div></div>`).join(''):`<div class="empty">No appointments added yet.</div>`}
function dashboard(){let today=new Date().toISOString().slice(0,10),ap=db.appointments.filter(a=>a.date===today).length,beds=db.rooms.reduce((n,r)=>n+(+r.beds||0),0),occ=db.rooms.reduce((n,r)=>n+(+r.occupied||0),0),pct=beds?Math.round(occ/beds*100):82,staff=db.doctors.length+db.nurses.length+db.staff.length,rev=db.billing.filter(x=>x.status==='Paid').reduce((n,x)=>n+(+x.amount||0),0);return `<div class="pagehead"><div><h1>Hospital Admin Dashboard</h1><p>Welcome back, <b>Dr. Administrator.</b> Here's your hospital overview.</p></div><div class="presentation-controls"><button class="btn secondary" onclick="togglePresentation()">▶ Present charts</button><div class="datearea"><span class="datepill">▦ ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span><span>Last Updated: <b>Just now</b></span></div></div></div><div class="stats">${stat('Total Patients',db.patients.length||'2,548','♟','#8b83ff',db.patients.length?'Saved demo records':'Illustrative sample KPI')}${stat("Today's Appointments",ap||84,'▣','#c278ff',ap?'Scheduled today':'Illustrative sample KPI')}${stat('Available Staff',staff||62,'♙','#30d88e',staff?'Doctors, nurses & staff':'Illustrative sample KPI')}${stat('Bed Occupancy',pct+'%','▱','#ff737c',beds?`${occ} of ${beds} beds occupied`:'Illustrative sample KPI')}${stat('Monthly Revenue',rev?'$'+rev.toLocaleString():'$983.2K','＄','#b65bff',rev?'Paid demo invoices':'Illustrative sample KPI')}</div><div class="grid2"><div class="card"><div class="cardhead"><h3>Patient Admissions (30 days)</h3><span class="muted tiny">Activity trend</span></div>${admissionsChart()}</div><div class="card"><div class="cardhead"><h3>Appointment Types</h3><span class="muted tiny">Distribution</span></div>${typeChart()}</div></div><div class="gridwide"><div class="card"><div class="cardhead"><h3>Recent Patients</h3><button class="btn secondary small" onclick="go('patients')">View all</button></div>${recent()}</div><div class="card"><div class="cardhead"><h3>Upcoming Appointments</h3><button class="btn secondary small" onclick="go('appointments')">View all</button></div>${upcoming()}</div></div><div class="card" style="margin-top:18px"><div class="cardhead"><h3>Quick Access Modules</h3><span class="muted tiny">18 system areas</span></div><div class="quickgrid">${sections.filter(s=>s[0]!=='dashboard').map(s=>`<button class="quick" onclick="go('${s[0]}')"><span>${s[2]}</span><b>${s[1]}</b><small>Open module →</small></button>`).join('')}</div></div><div class="notice">Educational demo only. The dashboard uses illustrative figures when no records exist. Data is saved in this browser using localStorage. Do not enter real patient information.</div>`}
function loginPage(){return `<div class="pagehead"><div><h1>AstroCare Secure Access</h1><p>Choose your dashboard and sign in with your assigned username and password.</p></div></div><div class="grid2"><div class="module"><h3>Sign in</h3><form id="loginForm" class="formgrid" style="margin-top:15px" onsubmit="event.preventDefault();login()"><div class="field full"><label>Dashboard / role</label><select id="loginRole" required>${Object.entries(accountDirectory).map(([id,a])=>`<option value="${id}">${a.label}</option>`).join('')}</select></div><div class="field full"><label>Username</label><input id="loginUsername" autocomplete="username" required></div><div class="field full"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div class="field full"><button class="btn" type="submit">Sign in to dashboard</button></div></form><p id="loginError" class="tiny" style="color:#ff8992" aria-live="polite"></p></div><div class="card"><h3>Available dashboards</h3>${Object.entries(accountDirectory).map(([id,a])=>`<div class="listrow"><div class="listicon">${(sections.find(x=>x[0]===id)||[])[2]||'•'}</div><div><strong>${a.label}</strong><p>${a.tasks.length} assigned responsibilities</p></div></div>`).join('')}<div class="notice">Demo accounts are provided for testing only. Replace them before any real deployment.</div></div></div><div class="notice">Security limitation: this is a standalone HTML prototype. Credentials and permissions in client-side JavaScript can be inspected or bypassed. Do not use real patient information or deploy this as a production authentication system. Real security requires a server, secure password hashing, HTTPS, server-side authorization, audit logging and database access controls.</div>`}
function login(){const id=document.getElementById('loginRole').value,a=accountDirectory[id],u=document.getElementById('loginUsername').value.trim(),pw=document.getElementById('loginPassword').value;if(!a||u!==a.username||pw!==a.password){document.getElementById('loginError').textContent='Incorrect dashboard, username or password.';return}activeAccount={role:a.role,username:a.username,dashboard:id};sessionStorage.setItem('astrocare_demo_session',JSON.stringify(activeAccount));page=id;render();notify('Signed in to '+a.label)}
function logout(){activeAccount=null;sessionStorage.removeItem('astrocare_demo_session');page='login';render();notify('You have signed out')}
function restoreSession(){try{const x=JSON.parse(sessionStorage.getItem('astrocare_demo_session')||'null');if(x&&accountDirectory[x.dashboard]&&x.role===accountDirectory[x.dashboard].role){activeAccount=x;page=x.dashboard}}catch{activeAccount=null}}
function tasksPanel(id){const a=accountDirectory[id];return `<div class="card" style="margin-top:18px"><div class="cardhead"><h3>Assigned responsibilities</h3><span class="muted tiny">${a.tasks.length} role tasks</span></div>${a.tasks.map((t,i)=>`<div class="listrow"><div class="listicon">${i+1}</div><div><strong>${esc(t)}</strong><p>Complete within your role and follow hospital policy</p></div></div>`).join('')}</div>`}
const roleDashboards=['doctor-dashboard','nurse-dashboard','reception-dashboard','patient-dashboard','pharmacy-dashboard','superadmin-dashboard'];
function miniRows(items,icon,empty){return items.length?items.map(x=>`<div class="listrow"><div class="listicon">${icon}</div><div><strong>${esc(x.title||'Record')}</strong><p>${esc(x.sub||'')}</p></div><div class="right">${esc(x.right||'')}</div></div>`).join(''):`<div class="empty">${empty}</div>`}
function roleDashboard(id){
 const today=new Date().toISOString().slice(0,10);
 const todayAppointments=db.appointments.filter(a=>a.date===today);
 const pendingAppointments=db.appointments.filter(a=>['Pending','Confirmed'].includes(a.status));
 const admitted=db.admissions.filter(a=>a.status==='Admitted');
 const lowStock=db.pharmacy.filter(m=>m.status==='Low stock'||m.status==='Out of stock'||(+m.quantity||0)<=(+m.reorderLevel||0));
 const pendingLabs=db.laboratory.filter(t=>t.status==='Requested'||t.status==='Processing');
 const pendingBills=db.billing.filter(b=>b.status!=='Paid');
 const configs={
  'doctor-dashboard':{title:'Doctor Dashboard',welcome:'Clinical workspace for appointments, assigned patients and care documentation.',stats:[["Today's Appointments",todayAppointments.length,'▦','#8b83ff','Scheduled for today'],['Patients',db.patients.length,'♟','#30d88e','Patient records in this demo'],['Pending Lab Tests',pendingLabs.length,'⚗','#ffb454','Requested or processing'],['Prescriptions',db.prescriptions.length,'℞','#62a6ff','Recorded prescriptions']],links:[['appointments','Appointments'],['patients','Patients'],['laboratory','Lab results'],['prescriptions','Prescriptions'],['admissions','Admissions']],leftTitle:'Upcoming appointments',left:db.appointments.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,5).map(a=>({title:a.patient||'Unnamed patient',sub:(a.doctor||'Doctor')+' · '+(a.type||'General'),right:(a.date||'—')+' '+(a.time||'')})),rightTitle:'Lab requests',right:pendingLabs.slice(0,5).map(a=>({title:a.test||'Lab test',sub:a.patient||'Patient not specified',right:a.status||'Requested'}))},
  'nurse-dashboard':{title:'Nurse Dashboard',welcome:'Ward overview for admissions, bed availability and patient coordination.',stats:[['Admitted Patients',admitted.length,'▣','#8b83ff','Current admission records'],['Total Patients',db.patients.length,'♟','#30d88e','Patient records'],['Rooms & Beds',db.rooms.length,'▱','#62a6ff','Configured room records'],['Pending Lab Tests',pendingLabs.length,'⚗','#ffb454','Awaiting completion']],links:[['admissions','Admissions'],['patients','Patients'],['rooms','Rooms & Beds'],['laboratory','Lab'],['appointments','Appointments']],leftTitle:'Current admissions',left:admitted.slice(0,5).map(a=>({title:a.patient||'Patient',sub:'Room / Bed: '+(a.room||'Not assigned'),right:a.admissionDate||'—'})),rightTitle:'Room availability',right:db.rooms.slice(0,5).map(r=>({title:'Room '+(r.roomNo||'—'),sub:r.type||'General',right:(r.occupied||0)+' / '+(r.beds||0)+' occupied'}))},
  'reception-dashboard':{title:'Receptionist Dashboard',welcome:'Front-desk workspace for patient registration, appointments and admissions.',stats:[['Total Patients',db.patients.length,'♟','#8b83ff','Registered demo records'],["Today's Appointments",todayAppointments.length,'▦','#30d88e','Scheduled today'],['Pending Appointments',pendingAppointments.length,'◷','#ffb454','Confirmed or pending'],['Current Admissions',admitted.length,'▣','#62a6ff','Admission records']],links:[['patients','Register patient'],['appointments','Manage appointments'],['admissions','Admissions'],['doctors','Doctor directory'],['insurance','Insurance']],leftTitle:'Recent patient registrations',left:db.patients.slice(-5).reverse().map(p=>({title:p.name||'Patient',sub:p.patientId||'No patient ID',right:p.status||'Active'})),rightTitle:'Upcoming appointments',right:db.appointments.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,5).map(a=>({title:a.patient||'Patient',sub:(a.doctor||'Doctor')+' · '+(a.type||'General'),right:(a.date||'—')+' '+(a.time||'')}))},
  'patient-dashboard':{title:'Patient Portal',welcome:'Private portal entry point. Personal records are not connected in this browser-only demo.',stats:[['Portal Access','Active','♙','#8b83ff','Demo sign-in only'],['Appointments','—','▦','#30d88e','Requires patient-linked backend'],['Prescriptions','—','℞','#62a6ff','Requires patient-linked backend'],['Invoices','—','＄','#ffb454','Requires patient-linked backend']],links:[],leftTitle:'Personal appointments',left:[],rightTitle:'Personal care documents',right:[]},
  'pharmacy-dashboard':{title:'Pharmacy Dashboard',welcome:'Medicine stock overview, prescription workflow and reorder monitoring.',stats:[['Medicine Items',db.pharmacy.length,'♧','#8b83ff','Inventory records'],['Low / Out of Stock',lowStock.length,'⚠','#ff737c','Check reorder levels'],['Prescriptions',db.prescriptions.length,'℞','#30d88e','Prescription records'],['Medical Supplies',db.supplies.length,'▧','#62a6ff','Supply inventory']],links:[['pharmacy','Medicine inventory'],['prescriptions','Prescriptions'],['supplies','Medical supplies'],['laboratory','Lab'],['reports','Reports']],leftTitle:'Stock requiring attention',left:lowStock.slice(0,5).map(m=>({title:m.name||'Medicine',sub:'Quantity: '+(m.quantity??'—')+' · Reorder at: '+(m.reorderLevel??'—'),right:m.status||'Review'})),rightTitle:'Recent prescriptions',right:db.prescriptions.slice(-5).reverse().map(a=>({title:a.medicine||'Medicine',sub:a.patient||'Patient',right:a.status||'Issued'}))},
  'superadmin-dashboard':{title:'Super Admin Dashboard',welcome:'System-wide overview of users, departments, modules and operational records.',stats:[['Admin Users',db.users.length,'⚙','#8b83ff','Configured accounts'],['Departments',db.departments.length,'▤','#30d88e','Hospital departments'],['Total Patients',db.patients.length,'♟','#62a6ff','Patient records'],['Pending Invoices',pendingBills.length,'＄','#ffb454','Not marked as paid']],links:[['users','Manage users'],['departments','Departments'],['reports','Reports & analytics'],['settings','System settings'],['billing','Billing']],leftTitle:'Module record counts',left:Object.keys(schema).slice(0,5).map(k=>({title:sections.find(s=>s[0]===k)?.[1]||k,sub:'Stored demo records',right:String(db[k].length)})),rightTitle:'System shortcuts',right:[{title:'User management',sub:'Review demo user records',right:'Open'},{title:'Reports & analytics',sub:'View module summaries',right:'Open'},{title:'Backup & restore',sub:'Available in system settings',right:'Open'}]}
 };
 const c=configs[id];if(!c)return dashboard();
 return `<div class="pagehead"><div><h1>${c.title}</h1><p>${c.welcome}</p></div><div class="datearea"><span class="datepill">▦ ${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span></div></div><div class="stats">${c.stats.map(x=>stat(...x)).join('')}</div><div class="grid2"><div class="card"><div class="cardhead"><h3>${c.leftTitle}</h3><span class="muted tiny">Latest records</span></div>${miniRows(c.left,'▦','No records available yet.')}</div><div class="card"><div class="cardhead"><h3>${c.rightTitle}</h3><span class="muted tiny">Overview</span></div>${miniRows(c.right,'✦','No records available yet.')}</div></div><div class="card" style="margin-top:18px"><div class="cardhead"><h3>Quick Access</h3><span class="muted tiny">Role-specific modules</span></div><div class="quickgrid">${c.links.map(([key,label])=>`<button class="quick" onclick="go('${key}')"><span>${esc((sections.find(s=>s[0]===key)||[])[2]||'›')}</span><b>${esc(label)}</b><small>Open module →</small></button>`).join('')}</div></div>${tasksPanel(id)}<div class="notice">Demo role workspace. Access is restricted by the prototype's client-side role menu only; this is not production-grade security. Do not enter real patient information.</div>`;
}
function status(v){let cls=['Pending','Processing','Low stock','Partially paid','Expired'].includes(v)?'pending':['Cancelled','Disabled','Out of stock'].includes(v)?'cancelled':!v?'neutral':'';return `<span class="status ${cls}">${esc(v||'Recorded')}</span>`}
function modulePage(id){let q=(document.getElementById('globalSearch').value||'').toLowerCase(),rows=db[id].map((x,i)=>({...x,_i:i})).filter(x=>JSON.stringify(x).toLowerCase().includes(q)),cols=schema[id];return `<div class="pagehead"><div><h1>${sections.find(s=>s[0]===id)[1]}</h1><p>Manage, search, update and export ${singular[id].toLowerCase()} records.</p></div><button class="btn" onclick="openAdd()">＋ Add ${singular[id]}</button></div><div class="module"><div class="toolbar"><input placeholder="Search ${singular[id].toLowerCase()}..." value="${esc(q)}" oninput="document.getElementById('globalSearch').value=this.value;render()"><select onchange="filterStatus(this.value)"><option value="">All statuses</option><option>Active</option><option>Pending</option><option>Completed</option><option>Paid</option><option>Available</option><option>Admitted</option><option>Low stock</option></select><span class="muted tiny">${rows.length} record(s)</span><button class="btn secondary push" onclick="exportCSV('${id}')">Export CSV</button></div><div class="tablewrap"><table class="datatable"><thead><tr>${cols.slice(0,6).map(c=>`<th>${c[1]}</th>`).join('')}<th>Status</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.slice(0,6).map(c=>`<td>${esc(r[c[0]]||'—')}</td>`).join('')}<td>${status(r.status)}</td><td><button class="btn secondary small" onclick="editRecord(${r._i})">Edit</button> <button class="btn red small" onclick="deleteRecord(${r._i})">Delete</button></td></tr>`).join(''):`<tr><td colspan="${Math.min(cols.length,6)+2}"><div class="empty">No records found. Click “Add ${singular[id]}” to create your first record.</div></td></tr>`}</tbody></table></div></div>`}
function filterStatus(v){let q=document.getElementById('globalSearch').value.toLowerCase(),rows=db[page].map((x,i)=>({...x,_i:i})).filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!v||Object.values(r).some(x=>String(x).toLowerCase()===v.toLowerCase()))),cols=schema[page];let body=document.querySelector('.datatable tbody');if(body)body.innerHTML=rows.length?rows.map(r=>`<tr>${cols.slice(0,6).map(c=>`<td>${esc(r[c[0]]||'—')}</td>`).join('')}<td>${status(r.status)}</td><td><button class="btn secondary small" onclick="editRecord(${r._i})">Edit</button> <button class="btn red small" onclick="deleteRecord(${r._i})">Delete</button></td></tr>`).join(''):`<tr><td colspan="9"><div class="empty">No matching records.</div></td></tr>`}
function reports(){let ks=Object.keys(schema);return `<div class="pagehead"><div><h1>Reports & Analytics</h1><p>Summary of demo records stored in this browser.</p></div><button class="btn" onclick="window.print()">Print report</button></div><div class="module"><div class="tablewrap"><table class="datatable"><thead><tr><th>Module</th><th>Records</th><th>Action</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${sections.find(s=>s[0]===k)[1]}</td><td>${db[k].length}</td><td><button class="btn secondary small" onclick="go('${k}')">Open</button></td></tr>`).join('')}</tbody></table></div><div class="notice">Reports are calculated from locally stored demo records. They are not audited clinical, operational or financial reports.</div></div>`}
function settings(){let s=getSettings();return `<div class="pagehead"><div><h1>System Settings</h1><p>Configure your demo hospital profile and data backup.</p></div></div><div class="module"><h3>Hospital Profile</h3><form id="settingsForm" class="formgrid" style="margin-top:15px"><div class="field"><label>Hospital name</label><input name="hospital" value="${esc(s.hospital)}"></div><div class="field"><label>Contact email</label><input name="email" type="email" value="${esc(s.email)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Location</label><input name="location" value="${esc(s.location)}"></div><div class="field"><label>Currency label</label><select name="currency"><option ${s.currency==='USD'?'selected':''}>USD</option><option ${s.currency==='RWF'?'selected':''}>RWF</option><option ${s.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>System language</label><select name="language"><option>English</option><option>Kinyarwanda</option></select></div><div class="field full"><button class="btn">Save settings</button></div></form><hr style="border-color:#35445b;margin:22px 0"><h3>Backup & Restore</h3><p class="muted tiny">Export all module data as a JSON backup. Import a previously exported AstroCare JSON file.</p><button class="btn secondary" onclick="backupAll()">Download full backup</button> <label class="btn secondary" for="restoreFile">Restore backup</label><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"> <button class="btn red" onclick="clearAll()">Clear all demo data</button><div class="notice">Demo login and role menus are client-side only and can be bypassed. Production use requires server-side authentication and authorization, secure password hashing, HTTPS, audit logs, database access controls and reliable backups.</div></div>`}
function getSettings(){try{return JSON.parse(localStorage.getItem('astrocare_settings'))||{hospital:'AstroCare Hospital',email:'info@example.test',phone:'+250 000 000 000',location:'Kigali, Rwanda',currency:'USD',language:'English'}}catch{return {hospital:'AstroCare Hospital',email:'',phone:'',location:'',currency:'USD',language:'English'}}}
function render(){let m=document.getElementById('main');if(!activeAccount){m.innerHTML=loginPage();document.getElementById('toplinks').innerHTML='';document.getElementById('sidebuttons').innerHTML='';document.querySelector('.profile b').textContent='Signed out';return}const allowed=rolePermissions[activeAccount.role]||[];if(!allowed.includes(page))page=activeAccount.dashboard;m.innerHTML=page==='dashboard'?dashboard():roleDashboards.includes(page)?roleDashboard(page):page==='reports'?reports():page==='settings'?settings():modulePage(page);buildNav();let sf=document.getElementById('settingsForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();let o={};new FormData(sf).forEach((v,k)=>o[k]=v);localStorage.setItem('astrocare_settings',JSON.stringify(o));notify('Settings saved')})}
function makeFields(rec){document.getElementById('fields').innerHTML=schema[page].map(([k,label,type,opts])=>{let v=rec[k]??'';let input=type==='select'?`<select name="${k}" required><option value="">Select ${label}</option>${opts.split(',').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}">${esc(v)}</textarea>`:`<input name="${k}" type="${type}" value="${esc(v)}" placeholder="${label}" ${['name','patient','test','medicine'].includes(k)?'required':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${input}</div>`}).join('')}
function openAdd(){editIndex=null;document.getElementById('modalTitle').textContent='Add '+singular[page];makeFields({});document.getElementById('modal').classList.add('open')}
function editRecord(i){editIndex=i;document.getElementById('modalTitle').textContent='Edit '+singular[page];makeFields(db[page][i]);document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();let obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);if(editIndex===null)db[page].push(obj);else db[page][editIndex]={...db[page][editIndex],...obj};save();closeModal();render();notify('Record saved successfully')});
function deleteRecord(i){if(confirm('Delete this record? This cannot be undone.')){db[page].splice(i,1);save();render();notify('Record deleted')}}
function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportCSV(id){let cols=schema[id],rows=db[id],csv=[cols.map(c=>'"'+c[1]+'"').join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c[0]]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download(csv,id+'-astrocare.csv','text/csv');notify('CSV exported')}
function backupAll(){download(JSON.stringify({app:'AstroCare Pro',version:1,createdAt:new Date().toISOString(),data:db},null,2),'astrocare-full-backup.json','application/json');notify('Backup downloaded')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!o.data)throw Error('Invalid backup');Object.keys(schema).forEach(k=>{if(Array.isArray(o.data[k]))db[k]=o.data[k]});save();render();notify('Backup restored')}catch(err){alert('Could not restore this file. Please choose a valid AstroCare JSON backup.')}e.target.value=''};reader.readAsText(f)}
function clearAll(){if(confirm('Delete all records from every AstroCare module in this browser?')){Object.keys(db).forEach(k=>db[k]=[]);save();render();notify('All demo records cleared')}}
restoreSession();
render();
</script>
</body></html>
